<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2421" />
      <stop offset="100%" stop-color="#12100e" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#d97706" stroke-opacity="0.3" stroke-width="4" />

  <!-- 3D Monogram / Isometric Cube "S" Container -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    
    <!-- Top Cube Face -->
    <polygon points="0,-120 110,-55 0,10 -110,-55" fill="url(#topFace)" />

    <!-- Right Cube Face -->
    <polygon points="0,10 110,-55 110,75 0,140" fill="url(#rightFace)" />

    <!-- Left Cube Face -->
    <polygon points="-110,-55 0,10 0,140 -110,75" fill="url(#leftFace)" />

    <!-- Stylized "S" Monogram 3D Inset/Ribbon overlay -->
    <!-- Top Loop of S -->
    <path d="M-55,-82 L0,-110 L55,-82 L0,-54 Z" fill="url(#goldAccent)" opacity="0.9" />
    <path d="M0,-54 L55,-82 L55,-12 L0,16 Z" fill="url(#topFace)" opacity="0.95" />
    <!-- Middle Connector of S -->
    <polygon points="-55,-28 0,-56 55,-28 0,0" fill="url(#goldAccent)" />
    <!-- Bottom Loop of S -->
    <polygon points="-55,-28 0,0 0,70 -55,42" fill="url(#leftFace)" opacity="0.9" />
    <polygon points="-55,42 0,70 55,42 0,14" fill="url(#topFace)" />

  </g>
</svg>
